[project]
name = "agentic-ai-tools-plugins"
version = "0.1.0"
description = "Builds the agentic-ai-tools agent plugin marketplace for Claude Code and Cursor."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.8.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
